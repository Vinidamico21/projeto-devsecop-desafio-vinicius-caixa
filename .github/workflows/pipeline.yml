name: 🔐 Pipeline DevSecOps

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ⚙️ Instalar dependências
        run: |
          npm ci

      - name: ⚙️ Build real
        run: |
          npm run build
          test -d dist
          echo "Build concluído com sucesso. Diretório de saída: dist"

      # ✅ Secrets Scanning com Gitleaks
      # Detecta credenciais, tokens e outras informações sensíveis no código
      - name: 🔑 Secrets Scanning com Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ SAST com Semgrep
      # Detecta vulnerabilidades como XSS, code injection, eval(), etc.
      - name: 🔍 SAST - Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto --config p/xss --error src/

      # ✅ SCA com Grype
      # Verifica dependências vulneráveis (supply chain security)
      - name: 📦 Gerar package-lock.json
        run: |
          npm install --package-lock-only --no-audit --no-fund
      
      - name: 📦 Instalar Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      
      - name: 📦 SCA - Grype
        run: |
          grype dir:. --fail-on medium

      # ── Empacota o site em um artefato tar (formato que o Pages consome)
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C dist \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest" > artifact.tar.sha256
          echo "SHA256: $digest"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ⚠️ MOCK DE ASSINATURA
      # Este passo NÃO assina de verdade — ele gera um bundle falso, só para
      # demonstração.
      #
      # Dica da assinatura real:
      #   cosign sign-blob artifact.tar --bundle artifact.sigstore.json --yes
      - name: ✍️ Assinar artefato
        run: |
          echo '{ "mock": "assinatura-invalida-para-demonstracao" }' > artifact.sigstore.json
          echo "Assinatura MOCK gerada."

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@v4.1.3
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # Usa o Cosign para validar assinatura do artefato
      - name: 🔎 Verificar assinatura do artefato
        run: |
          cosign verify-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" || true
          echo "Verificação de assinatura concluída."

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4